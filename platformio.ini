; Waveshare ESP32-C6-Touch-LCD-1.47 (ESP32-C6FH8, 8 MB flash)
;
; The stock PlatformIO "espressif32" platform has no Arduino support for the
; ESP32-C6 (its C6 boards list only espidf), so this project uses the
; community pioarduino platform, which ships Arduino core 3.x.

[platformio]
default_envs = spotify

[env]
; Pinned to 54.03.21 = Arduino core 3.2.1. GFX Library 1.5.9 does not compile
; on core 3.3.x (spiFrequencyToClockDiv() changed signature there).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
; The esptool 5.0.0-dev1 bundled with 54.03.21 crashes with click >= 8.2
; (this machine's PlatformIO has click 8.5), so use a newer esptool instead.
platform_packages =
    tool-esptoolpy @ https://github.com/pioarduino/esptool/releases/download/v5.6.0/esptool.zip
board = esp32-c6-devkitc-1
framework = arduino
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 115200
; Serial over the native USB-C port (same as "USB CDC On Boot: Enabled")
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    moononournation/GFX Library for Arduino@1.5.9

; Spotify "now playing" (landscape). Set up once with:
;   python tools\spotify_login.py
[env:spotify]
build_src_filter = +<spotify.cpp>
lib_deps =
    ${env.lib_deps}
    bblanchon/ArduinoJson@^7.0.0
    bitbank2/JPEGDEC@^1.6.0

; Photo frame (portrait): upload pictures from a web page served by the board.
; Uses its own partition table: one app slot, the rest of flash for pictures.
[env:photos]
build_src_filter = +<photos.cpp>
board_build.partitions = partitions_photos.csv
board_build.filesystem = littlefs

; Animated eyes (landscape): sweep left and right, blink, tap for happy eyes
[env:eyes]
build_src_filter = +<eyes.cpp>

; Step 1-3: colour fills + edge outline + colour bars
[env:display_test]
build_src_filter = +<display_test.cpp>

; Step 4: draws a dot where you touch (AXS5106L)
[env:touch_test]
build_src_filter = +<touch_test.cpp>

; WiFi radio check: creates a "KeychainTest" network and lists what it hears
[env:wifi_test]
build_src_filter = +<wifi_test.cpp>
